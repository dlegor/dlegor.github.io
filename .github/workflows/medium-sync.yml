name: Sync Medium posts

on:
  schedule:
    - cron: "17 */6 * * *"  # every 6 hours
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: medium-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update Blog section from Medium RSS
        run: python3 scripts/sync_medium.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- index.html; then
            echo "No new posts."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Sync Medium posts"
          git push
